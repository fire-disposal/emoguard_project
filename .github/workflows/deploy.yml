name: Build & Deploy Backend Stack

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deploy'

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}/emoguard-backend
  DEPLOY_ROOT: /var/www/emoguard
  # 2026-09-14 校准：部署目录不再用 ~（那会让 compose 项目名变成 root、文件散落在 /root），
  # 统一到 /opt/emoguard，并用显式项目名 emoguard（容器名与卷名在 compose 内已钉死，数据不受影响）。
  DEPLOY_DIR: /opt/emoguard
  COMPOSE_PROJECT: emoguard

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version Tag
        id: ver
        run: |
          set -euo pipefail
          TAG_SHORT=$(echo "${GITHUB_SHA:0:8}")
          TAG_FINAL="${TAG_SHORT:-latest}" 
          echo "IMAGE=${{ env.IMAGE_BASE }}:$TAG_FINAL" >> $GITHUB_OUTPUT
          echo "TAG=$TAG_FINAL" >> $GITHUB_OUTPUT

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.ver.outputs.IMAGE }}
            ${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH Key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Render & Upload Stack Files
        run: |
          set -euo pipefail

          sed "s|__IMAGE__|${{ steps.ver.outputs.IMAGE }}|g" \
            docker-compose.yml > docker-compose.rendered.yml

          echo "📁 确保部署目录存在: ${{ env.DEPLOY_DIR }}"
          # backups/ 一并创建并归属部署用户：否则首次部署前备份会因目录不可写而
          # fail-closed 卡住（该目录由 root 预建过）
          ssh -i ~/.ssh/id_rsa -T ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo mkdir -p ${{ env.DEPLOY_DIR }}/backups && sudo chown \$USER:\$USER ${{ env.DEPLOY_DIR }} ${{ env.DEPLOY_DIR }}/backups"

          echo "📤 Uploading compose to server (server-side ${{ env.DEPLOY_DIR }}/.env is manually managed, untouched)..."
          scp -i ~/.ssh/id_rsa docker-compose.rendered.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.yml

          # 部署前备份脚本（该库此前没有任何备份）
          scp -i ~/.ssh/id_rsa scripts/pre-deploy-backup.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/pre-deploy-backup.sh

      - name: Deploy Stack via SSH
        shell: bash
        run: |
          ssh -i ~/.ssh/id_rsa -T ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << 'EOF'
            set -euo pipefail

            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            compose() { docker compose -p ${{ env.COMPOSE_PROJECT }} -f "$DEPLOY_DIR/docker-compose.yml" --env-file "$DEPLOY_DIR/.env" "$@"; }

            echo "🔎 校验服务器 $DEPLOY_DIR/.env (运行时密钥由服务器手动维护, CI 不再生成)..."
            if [ ! -f "$DEPLOY_DIR/.env" ]; then
              echo "❌ $DEPLOY_DIR/.env 不存在。请先在服务器创建并填入运行时密钥后重试。"
              exit 1
            fi
            # 注意：`VAR=`（空值）在 compose 里算“已设置”，旧检查 grep -q "^VAR=" 会放过，
            # 直到容器启动才因 JWT_SIGNING_KEY 为空而失败。故此处校验值非空。
            for k in JWT_SIGNING_KEY SECRET_KEY POSTGRES_PASSWORD REDIS_PASSWORD \
                     DJANGO_SUPERUSER_USERNAME WECHAT_MINI_PROGRAM_APP_ID \
                     WECHAT_MINI_PROGRAM_APP_SECRET WECHAT_SUBSCRIPTION_TEMPLATES; do
              v=$(sed -n "s/^${k}=//p" "$DEPLOY_DIR/.env" | tail -n1)
              [ -n "$v" ] || { echo "❌ .env 的 ${k} 缺失或为空值"; exit 1; }
            done
            echo "✅ .env 必需键齐全且非空"

            echo "🔑 Docker登录..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📂 确保挂载目录存在并设置权限..."
            if sudo mkdir -p ${{ env.DEPLOY_ROOT }}/media ${{ env.DEPLOY_ROOT }}/staticfiles ${{ env.DEPLOY_ROOT }}/logs; then
                echo "✅ 目录已就绪: ${{ env.DEPLOY_ROOT }}"
                sudo chown -R 1000:1000 ${{ env.DEPLOY_ROOT }} || echo "⚠️ 无法设置chown，可能需要手动介入"
                sudo chmod -R 775 ${{ env.DEPLOY_ROOT }} || echo "⚠️ 无法设置chmod"
            else
                echo "❌ 无法创建目录 ${{ env.DEPLOY_ROOT }}。"
                echo "👉 请登录服务器手动执行以下命令："
                echo "   sudo mkdir -p ${{ env.DEPLOY_ROOT }}/media ${{ env.DEPLOY_ROOT }}/staticfiles ${{ env.DEPLOY_ROOT }}/logs"
                echo "   sudo chown -R 1000:1000 ${{ env.DEPLOY_ROOT }}"
                echo "   sudo chmod -R 775 ${{ env.DEPLOY_ROOT }}"
                exit 1
            fi

            echo "🗄️ 确保命名数据卷存在（compose 已声明 external，不会被创建或删除）..."
            for v in emoguard_pg_data emoguard_redis_data; do
              docker volume inspect "$v" >/dev/null 2>&1 || { echo "➕ 创建数据卷 $v"; docker volume create "$v" >/dev/null; }
            done
            echo "🔒 数据卷就绪（严禁 docker compose down -v / docker volume rm）"

            # 回滚锚点：记录当前在用的镜像 tag（失败时回退到它）
            OLD_IMG=$(docker inspect --format '{{.Config.Image}}' emoguard-backend 2>/dev/null || echo "")
            OLD_TAG=$(echo "$OLD_IMG" | rev | cut -d: -f1 | rev)
            NEW_TAG="${{ steps.ver.outputs.TAG }}"
            echo "🔖 当前版本（回滚锚点）: ${OLD_TAG:-无}"

            # 回滚：把编排中的镜像换成旧 tag 后就地重启。两个失败出口（compose up 失败、
            # 健康检查失败）都走这里，避免“新版本起不来且未回退”的持续停机。
            rollback() {
              local target="$1"
              if [ -z "$target" ] || [ "$target" = "$NEW_TAG" ]; then
                echo "⚠️ 无可用的回滚锚点，请人工介入（$NEW_TAG 未能就绪）"
                return 1
              fi
              echo "↩️ 自动回滚到 $target ..."
              local img="${{ env.IMAGE_BASE }}:${target}"
              docker image inspect "$img" >/dev/null 2>&1 || docker pull "$img" || true
              sed "s|image: .*emoguard-backend:.*|image: ${img}|g" "$DEPLOY_DIR/docker-compose.yml" > "$DEPLOY_DIR/docker-compose.rollback.yml"
              docker compose -p ${{ env.COMPOSE_PROJECT }} -f "$DEPLOY_DIR/docker-compose.rollback.yml" --env-file "$DEPLOY_DIR/.env" up -d --remove-orphans || true
              echo "⚠️ 已尝试回滚到 ${target}，请人工确认后重试部署"
            }

            # —— 部署前数据库备份（fail-closed）——
            # 该库此前完全没有备份（12 MB / 29 张表，卷 emoguard_pg_data）；备份失败即中止，
            # 避免“升级出问题、又没有可回退的数据状态”。
            echo "🗄️ 备份数据库（失败即中止部署）"
            bash "$DEPLOY_DIR/pre-deploy-backup.sh" backup

            echo "📥 拉取镜像..."
            compose pull

            echo "🔍 验证镜像:"
            docker images | grep emoguard || echo "⚠️ 未找到emoguard镜像"

            # 2026-09-14 校准：不再 down→up（那会造成停机窗口且失败时无回滚）；
            # 改为就地 up -d --remove-orphans（compose 只重建变化的容器）。
            echo "🚀 启动/更新容器..."
            if ! compose up -d --remove-orphans; then
              echo "❌ compose up 失败（容器未能更新）"
              docker ps -a | grep emoguard || true
              compose logs backend --tail 50 || true
              rollback "$OLD_TAG"
              exit 1
            fi

            echo "⏳ 等待容器初始化..."
            sleep 10

            echo "📋 检查容器状态:"
            docker ps -a | grep emoguard || true

            echo "📋 检查端口监听:"
            ss -tlnp | grep :8000 || true

            echo "🔍 开始健康检查 (Max 20 attempts, 5s interval)..."
            health_check_passed=false
            for i in {1..20}; do
              if docker exec emoguard-backend curl -fsS http://localhost:8000/health/; then
                echo "✅ 健康检查通过"
                health_check_passed=true
                break
              fi
              echo "⏳ Health check $i/20 failed, waiting 5 seconds..."
              if [ $i -eq 5 ] || [ $i -eq 10 ] || [ $i -eq 15 ]; then
                echo "--- 诊断信息 ---"
                docker ps -a | grep emoguard
                compose logs backend --tail 50
                echo "----------------"
              fi
              sleep 5
            done

            if [ "$health_check_passed" != "true" ]; then
              echo "❌ 健康检查失败"
              docker ps -a | grep emoguard || true
              compose logs backend --tail 50 || true
              compose logs db --tail 20 || true
              compose logs redis --tail 20 || true
              rollback "$OLD_TAG"
              exit 1
            fi

            echo "📦 记录成功部署的版本..."
            echo "${{ steps.ver.outputs.TAG }}" > "$DEPLOY_DIR/last_successful_version.txt"

            echo "🧹 清理悬空镜像（保留在用与最近 3 个）..."
            docker image prune -f >/dev/null 2>&1 || true

            echo "✅ Deploy OK"
          EOF

      - name: ✅ Finish Deployment
        run: "echo \"🚀 Deploy finished — Image: ${{ steps.ver.outputs.IMAGE }}\""
